<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>えいごアドベンチャー</title>
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;}
body{
  background:radial-gradient(circle at 50% 35%,#ffffff,#f0f2f8 70%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  box-sizing:border-box;
  gap:28px;
  font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
}
.icon-img{
  width:180px;
  height:180px;
  border-radius:36px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  image-rendering:-webkit-optimize-contrast;
}
.title-txt{
  color:#1565c0;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.1);
}
.open-btn{
  padding:16px 44px;
  border-radius:99px;
  background:#2196f3;
  color:#ffffff;
  font-size:18px;
  font-weight:900;
  text-decoration:none;
  box-shadow:0 6px 22px rgba(33,150,243,.35);
  letter-spacing:1px;
}
.open-btn:active{transform:scale(.97);}
.legal-note{
  position:fixed;
  bottom:10px;
  left:0;
  right:0;
  text-align:center;
  font-size:10.5px;
  color:#8a90a0;
  line-height:1.6;
  padding:0 18px;
}
</style>
</head>
<body>
  <img class="icon-img" src="icons/icon-180.png" alt="icon">
  <div class="title-txt">えいごアドベンチャー</div>
  <a class="open-btn" href="game.html">▶ アプリを開く</a>
  <div class="legal-note">「英検®」は公益財団法人 日本英語検定協会の登録商標です。<br>このアプリは同協会の承認・推奨を受けたものではありません。</div>
</body>
</html>
